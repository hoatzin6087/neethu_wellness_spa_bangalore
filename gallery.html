    <!-- Modal Preview -->
    <div class="modal fade" id="imagePreviewModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 position-relative text-center">
                    <button type="button" class="btn-close btn-close-white p-3" data-bs-dismiss="modal" aria-label="Close" style="position:absolute; right:10px; top:10px; z-index:1051;"></button>
                    <div id="imagePreviewModalBody" class="d-flex justify-content-center align-items-center p-3"></div>
                    <button id="prevImage" class="btn btn-light" style="position:absolute; left:10px; top:50%; transform:translateY(-50%);">‹</button>
                    <button id="nextImage" class="btn btn-light" style="position:absolute; right:10px; top:50%; transform:translateY(-50%);">›</button>
                </div>
            </div>
        </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            var $thumbs = $('.gallery-thumb');
            var $modal = $('#imagePreviewModal');
            var $body = $('#imagePreviewModalBody');
            var currentIndex = -1;
            var items = [];

            $thumbs.each(function (i, el) { items.push($(el).data('full') || $(el).attr('src')); $(el).attr('data-idx', i); });

            function showIndex(i) {
                i = (i + items.length) % items.length;
                currentIndex = i;
                $body.html('<img src="' + items[i] + '" class="img-fluid" alt="" />');
                $modal.modal('show');
            }

            $thumbs.on('click', function () { showIndex(parseInt($(this).attr('data-idx'), 10)); });
            $('#nextImage').on('click', function () { showIndex(currentIndex + 1); });
            $('#prevImage').on('click', function () { showIndex(currentIndex - 1); });

            $(document).on('keydown', function (e) {
                if (!$modal.hasClass('show')) return;
                if (e.key === 'ArrowRight') showIndex(currentIndex + 1);
                if (e.key === 'ArrowLeft') showIndex(currentIndex - 1);
                if (e.key === 'Escape') $modal.modal('hide');
            });
        })();
    </script>
